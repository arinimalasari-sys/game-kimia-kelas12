<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>Kimia Millionaire</title>
<!-- Three.js via CDN HTTPS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  }
  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background: linear-gradient(145deg, #0a0f1e 0%, #1a1f2f 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px 8px 30px;
    color: #e2f0fa;
  }

  /* ===== CANVAS THREE.JS ===== */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.35;
    pointer-events: none;
  }

  /* ===== GAME CONTAINER ===== */
  .game-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    background: rgba(10, 20, 30, 0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 30px;
    border: 2px solid rgba(255, 215, 0, 0.35);
    box-shadow: 0 20px 50px rgba(0,0,0,0.7),
                0 0 35px rgba(255, 215, 0, 0.15);
    padding: 16px 14px 20px;
    overflow: hidden;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .title {
    font-size: 1.15rem;
    font-weight: 900;
    background: linear-gradient(135deg, #FFE9A0 0%, #FFD966 40%, #FFB347 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.6px;
    text-shadow: 0 0 18px rgba(255, 200, 0, 0.4);
  }
  .stage-badge {
    background: linear-gradient(145deg, #1a2c3c, #0e1a24);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.68rem;
    font-weight: 800;
    color: #FFD966;
    border: 1px solid rgba(255, 217, 102, 0.4);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  /* ===== LADDER ===== */
  .ladder {
    display: flex;
    justify-content: space-between;
    gap: 2px;
    background: #07121c;
    border-radius: 30px;
    padding: 6px 8px;
    margin-bottom: 14px;
    border: 1px solid #2e4a5e;
  }
  .ladder span {
    flex: 1;
    text-align: center;
    font-size: 0.6rem;
    font-weight: 700;
    color: #5b7a94;
    padding: 3px 0;
    border-radius: 12px;
    transition: all 0.25s;
  }
  .ladder span.active {
    background: linear-gradient(145deg, #FFD966, #FFB347);
    color: #0a0f1e;
    box-shadow: 0 0 10px rgba(255, 200, 0, 0.7);
    transform: scale(1.12);
  }
  .ladder span.passed {
    color: #3dd68c;
  }

  /* ===== QUESTION CARD ===== */
  .question-card {
    background: linear-gradient(145deg, #0f1b2b, #0a121e);
    border: 2px solid #3e5a6e;
    border-radius: 26px;
    padding: 22px 16px;
    margin-bottom: 16px;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.7),
                0 8px 0 #050a10;
    min-height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .question-text {
    font-size: 1rem;
    font-weight: 600;
    color: #f0f9ff;
    line-height: 1.5;
    word-break: break-word;
  }

  /* ===== OPTIONS ===== */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .option-btn {
    display: flex;
    align-items: center;
    background: linear-gradient(145deg, #162b3a, #0e1f2c);
    border: 2px solid #2e4a5e;
    border-radius: 50px;
    padding: 13px 16px;
    color: #e2f0fa;
    font-size: 0.88rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, background 0.2s, border 0.2s;
    box-shadow: 0 5px 0 #050b10;
    line-height: 1.35;
  }
  .option-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #050b10;
  }
  .option-btn.correct {
    background: linear-gradient(145deg, #1b5e3a, #0e3a22);
    border-color: #3dd68c;
    box-shadow: 0 5px 0 #0a2417, 0 0 18px rgba(61, 214, 140, 0.6);
  }
  .option-btn.wrong {
    background: linear-gradient(145deg, #6b1f1f, #3d0e0e);
    border-color: #e04b4b;
    box-shadow: 0 5px 0 #2a0808;
  }
  .option-btn.disabled {
    pointer-events: none;
    opacity: 0.55;
  }
  .option-btn.hidden-5050 {
    opacity: 0.18;
    pointer-events: none;
    filter: grayscale(1);
  }
  .option-letter {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 30px;
    height: 30px;
    background: #1f3b4e;
    border-radius: 50%;
    margin-right: 12px;
    font-weight: 800;
    color: #FFD966;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  /* ===== LIFELINES ===== */
  .lifelines {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .lifeline-btn {
    background: linear-gradient(145deg, #1a2c3c, #0f1e2a);
    border: 2px solid rgba(255, 217, 102, 0.5);
    border-radius: 16px;
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #FFD966;
    font-weight: 700;
    font-size: 0.68rem;
    gap: 3px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
    box-shadow: 0 4px 0 #0b141c;
    text-align: center;
  }
  .lifeline-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #0b141c;
  }
  .lifeline-btn.used {
    opacity: 0.28;
    pointer-events: none;
    filter: grayscale(1);
  }
  .lifeline-icon {
    font-size: 1.05rem;
    line-height: 1.1;
    font-weight: 800;
  }

  /* ===== SCORE ===== */
  .score-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #07121c;
    border-radius: 50px;
    padding: 11px 18px;
    border: 1px solid #2e4a5e;
    margin-bottom: 12px;
  }
  .score-label {
    font-size: 0.72rem;
    color: #9bb7d4;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .score-value {
    font-size: 1.05rem;
    font-weight: 900;
    color: #FFD966;
    letter-spacing: 0.5px;
    text-shadow: 0 0 12px rgba(255, 200, 0, 0.5);
  }

  /* ===== ACTIONS ===== */
  .action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .btn {
    padding: 13px 8px;
    border-radius: 40px;
    border: none;
    font-weight: 800;
    font-size: 0.82rem;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.3px;
  }
  .btn:active {
    transform: translateY(2px);
  }
  .btn-primary {
    background: linear-gradient(145deg, #FFD966, #FF9800);
    color: #0a0f1e;
    box-shadow: 0 5px 0 #9e6b00;
  }
  .btn-primary:disabled {
    background: #2a3a4a;
    color: #5b7a94;
    box-shadow: 0 5px 0 #0a141e;
    cursor: not-allowed;
    transform: none;
  }
  .btn-download {
    background: linear-gradient(145deg, #1e3a5a, #0f2038);
    color: #b8d4ff;
    box-shadow: 0 5px 0 #0a1420;
    border: 1px solid #2e4a5e;
  }

  /* ===== GAME OVER MSG ===== */
  .game-over-msg {
    text-align: center;
    font-size: 0.95rem;
    font-weight: 700;
    color: #FFD966;
    margin-top: 14px;
    min-height: 22px;
    line-height: 1.4;
    text-shadow: 0 0 12px rgba(255, 200, 0, 0.4);
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e2e3e;
    color: #FFD966;
    padding: 12px 22px;
    border-radius: 40px;
    border: 1px solid #FFD966;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 999;
    box-shadow: 0 8px 25px black, 0 0 20px rgba(255, 200, 0, 0.3);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    max-width: 92%;
    text-align: center;
    line-height: 1.35;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 380px) {
    .title { font-size: 1rem; }
    .ladder span { font-size: 0.52rem; }
    .question-text { font-size: 0.92rem; }
    .option-btn { font-size: 0.82rem; padding: 12px 14px; }
    .btn { font-size: 0.76rem; padding: 12px 6px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="game-container">
  <!-- HEADER -->
  <div class="header">
    <div class="title">🧪 KIMIA MILLIONAIRE</div>
    <div class="stage-badge" id="stageBadge">STAGE 1</div>
  </div>

  <!-- LADDER -->
  <div class="ladder" id="ladder"></div>

  <!-- QUESTION -->
  <div class="question-card">
    <div class="question-text" id="questionText">Memuat soal...</div>
  </div>

  <!-- OPTIONS -->
  <div class="options-grid" id="optionsContainer"></div>

  <!-- LIFELINES -->
  <div class="lifelines">
    <button class="lifeline-btn" id="btnFifty" onclick="useFiftyFifty()">
      <span class="lifeline-icon">50:50</span>
      <span>Hapus 2</span>
    </button>
    <button class="lifeline-btn" id="btnHint" onclick="useHint()">
      <span class="lifeline-icon">💡</span>
      <span>Petunjuk</span>
    </button>
    <button class="lifeline-btn" id="btnSkip" onclick="useSkip()">
      <span class="lifeline-icon">⏭️</span>
      <span>Lewati</span>
    </button>
  </div>

  <!-- SCORE -->
  <div class="score-box">
    <span class="score-label">💰 HADIAH SAAT INI</span>
    <span class="score-value" id="scoreDisplay">Rp 0</span>
  </div>

  <!-- ACTIONS -->
  <div class="action-buttons">
    <button class="btn btn-download" onclick="downloadProgress()">⬇️ Unduh JSON</button>
    <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>➡️ Lanjut</button>
  </div>

  <div class="game-over-msg" id="gameOverMsg"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KIMIA MILLIONAIRE - Who Wants to Be a Millionaire (Kimia)
   ============================================================ */

/* ---------- DATA SOAL (15 SOAL, 3 STAGE) ---------- */
const questions = [
  /* ===== STAGE 1 — KELAS X (soal 1-5) ===== */
  {
    stage: 1,
    question: "Partikel penyusun atom yang bermuatan negatif dan bergerak mengelilingi inti adalah...",
    options: ["Proton", "Elektron", "Neutron", "Positron"],
    correct: 1,
    hint: "Partikel ini ditemukan oleh J.J. Thomson."
  },
  {
    stage: 1,
    question: "Lambang unsur Kimia untuk Natrium adalah...",
    options: ["Na", "N", "Ni", "K"],
    correct: 0,
    hint: "Berasal dari bahasa Latin 'Natrium'."
  },
  {
    stage: 1,
    question: "Ikatan kimia yang terbentuk karena serah terima elektron disebut ikatan...",
    options: ["Kovalen", "Ion", "Logam", "Hidrogen"],
    correct: 1,
    hint: "Terbentuk antara logam dan nonlogam, contohnya NaCl."
  },
  {
    stage: 1,
    question: "Jumlah proton dalam atom Karbon yang memiliki nomor atom 6 adalah...",
    options: ["6", "12", "14", "8"],
    correct: 0,
    hint: "Nomor atom = jumlah proton = jumlah elektron (atom netral)."
  },
  {
    stage: 1,
    question: "Larutan yang dapat menghantarkan listrik karena terionisasi sempurna disebut...",
    options: ["Elektrolit kuat", "Elektrolit lemah", "Non-elektrolit", "Asam lemah"],
    correct: 0,
    hint: "Contohnya NaCl, HCl, dan H2SO4."
  },

  /* ===== STAGE 2 — KELAS XI (soal 6-10) ===== */
  {
    stage: 2,
    question: "Jika diketahui ΔH reaksi pembentukan air = -286 kJ/mol, maka reaksi tersebut bersifat...",
    options: ["Endoterm", "Eksoterm", "Isoterm", "Adiabatik"],
    correct: 1,
    hint: "ΔH negatif menandakan melepas kalor ke lingkungan."
  },
  {
    stage: 2,
    question: "Faktor yang TIDAK mempengaruhi laju reaksi adalah...",
    options: ["Suhu", "Konsentrasi", "Katalis", "Warna larutan"],
    correct: 3,
    hint: "Warna tidak mempengaruhi kecepatan reaksi kimia."
  },
  {
    stage: 2,
    question: "pH larutan HCl 0,01 M (asam kuat) adalah...",
    options: ["1", "2", "3", "12"],
    correct: 1,
    hint: "pH = -log[H+] = -log(10^-2)."
  },
  {
    stage: 2,
    question: "Reaksi redoks adalah reaksi yang melibatkan...",
    options: ["Pengikatan oksigen saja", "Perubahan bilangan oksidasi", "Reaksi asam basa", "Pembentukan endapan"],
    correct: 1,
    hint: "Ada kenaikan (oksidasi) dan penurunan (reduksi) biloks."
  },
  {
    stage: 2,
    question: "Senyawa organik yang memiliki gugus fungsi -OH adalah...",
    options: ["Alkana", "Alkena", "Alkohol", "Eter"],
    correct: 2,
    hint: "Contohnya etanol (C2H5OH)."
  },

  /* ===== STAGE 3 — KELAS XII (soal 11-15) ===== */
  {
    stage: 3,
    question: "Sifat koligatif larutan yang bergantung pada jumlah partikel zat terlarut adalah...",
    options: ["Titik didih", "Tekanan osmotik", "Massa jenis", "Viskositas"],
    correct: 1,
    hint: "Termasuk sifat koligatif bersama kenaikan titik didih & penurunan titik beku."
  },
  {
    stage: 3,
    question: "Pada elektrolisis larutan NaCl, gas klorin (Cl2) dihasilkan di...",
    options: ["Katoda", "Anoda", "Ruang tengah", "Tidak dihasilkan"],
    correct: 1,
    hint: "Oksidasi ion klorida (Cl-) terjadi di anoda."
  },
  {
    stage: 3,
    question: "Unsur transisi yang memiliki bilangan oksidasi +7 dalam senyawa KMnO4 adalah...",
    options: ["Fe", "Mn", "Cr", "Cu"],
    correct: 1,
    hint: "Unsur ini terdapat pada kalium permanganat."
  },
  {
    stage: 3,
    question: "Senyawa kompleks [Cu(NH3)4]SO4 memiliki bilangan koordinasi...",
    options: ["2", "4", "6", "8"],
    correct: 1,
    hint: "Jumlah ligan NH3 yang terikat pada ion pusat Cu."
  },
  {
    stage: 3,
    question: "Polimer yang terbentuk dari monomer etilena (C2H4) adalah...",
    options: ["PVC", "Polietilena", "Nilon", "Bakelit"],
    correct: 1,
    hint: "Plastik paling umum, digunakan untuk kantong plastik."
  }
];

/* ---------- MONEY LADDER (15 TINGKAT) ---------- */
const moneyLadder = [
  100000, 200000, 300000, 500000, 1000000,
  2000000, 5000000, 10000000, 20000000, 50000000,
  100000000, 250000000, 500000000, 750000000, 1000000000
];

/* ---------- STATE GAME ---------- */
let currentIndex = 0;
let score = 0;
let stage = 1;
let gameActive = true;
let optionsLocked = false;
let lifelines = { fifty: false, hint: false, skip: false };
let currentCorrectIndex = 0;

/* ---------- THREE.JS BACKGROUND ---------- */
let scene, camera, renderer, particles = [];

function initThree() {
  const canvas = document.getElementById('bg-canvas');
  const w = window.innerWidth;
  const h = window.innerHeight;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, w / h, 0.1, 1000);
  camera.position.z = 6;

  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  /* Partikel atom emas & biru */
  const geoGold = new THREE.SphereGeometry(0.09, 10, 10);
  const geoBlue = new THREE.SphereGeometry(0.07, 10, 10);
  const matGold = new THREE.MeshStandardMaterial({ color: 0xFFD966, emissive: 0x553300, roughness: 0.4 });
  const matBlue = new THREE.MeshStandardMaterial({ color: 0x2266FF, emissive: 0x001133, roughness: 0.4 });

  for (let i = 0; i < 70; i++) {
    const isGold = i % 2 === 0;
    const p = new THREE.Mesh(isGold ? geoGold : geoBlue, isGold ? matGold : matBlue);
    p.position.x = (Math.random() - 0.5) * 14;
    p.position.y = (Math.random() - 0.5) * 14;
    p.position.z = (Math.random() - 0.5) * 8;
    p.userData = {
      vx: (Math.random() - 0.5) * 0.008,
      vy: (Math.random() - 0.5) * 0.008,
      vz: (Math.random() - 0.5) * 0.008
    };
    scene.add(p);
    particles.push(p);
  }

  /* Pencahayaan */
  scene.add(new THREE.AmbientLight(0x404060, 0.9));
  const pl1 = new THREE.PointLight(0xFFD966, 1.1, 25);
  pl1.position.set(4, 4, 5);
  scene.add(pl1);
  const pl2 = new THREE.PointLight(0x2266FF, 0.8, 25);
  pl2.position.set(-4, -3, 4);
  scene.add(pl2);

  animateThree();

  window.addEventListener('resize', () => {
    const w2 = window.innerWidth;
    const h2 = window.innerHeight;
    renderer.setSize(w2, h2);
    camera.aspect = w2 / h2;
    camera.updateProjectionMatrix();
  });
}

function animateThree() {
  requestAnimationFrame(animateThree);
  particles.forEach(p => {
    p.position.x += p.userData.vx;
    p.position.y += p.userData.vy;
    p.position.z += p.userData.vz;
    /* Pantulan di batas ruang */
    if (p.position.x > 7 || p.position.x < -7) p.userData.vx *= -1;
    if (p.position.y > 7 || p.position.y < -7) p.userData.vy *= -1;
    if (p.position.z > 5 || p.position.z < -5) p.userData.vz *= -1;
  });
  renderer.render(scene, camera);
}

/* ---------- RENDER LADDER ---------- */
function renderLadder() {
  const ladder = document.getElementById('ladder');
  ladder.innerHTML = '';
  for (let i = 0; i < 15; i++) {
    const s = document.createElement('span');
    s.textContent = i + 1;
    if (i === currentIndex) s.classList.add('active');
    else if (i < currentIndex) s.classList.add('passed');
    ladder.appendChild(s);
  }
}

/* ---------- FORMAT RUPIAH ---------- */
function rupiah(n) {
  return 'Rp ' + n.toLocaleString('id-ID');
}

/* ---------- UPDATE STAGE BADGE ---------- */
function updateStageBadge() {
  const labels = { 1: 'STAGE 1 · KELAS X', 2: 'STAGE 2 · KELAS XI', 3: 'STAGE 3 · KELAS XII' };
  document.getElementById('stageBadge').textContent = labels[stage] || 'STAGE 1';
}

/* ---------- UPDATE SCORE ---------- */
function updateScore() {
  document.getElementById('scoreDisplay').textContent = rupiah(score);
}

/* ---------- LOAD SOAL ---------- */
function loadQuestion() {
  if (currentIndex >= questions.length) {
    endGame(true);
    return;
  }

  const q = questions[currentIndex];
  stage = q.stage;
  currentCorrectIndex = q.correct;
  optionsLocked = false;

  document.getElementById('questionText').textContent = q.question;
  updateStageBadge();
  renderLadder();

  /* Render opsi */
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option-btn';
    btn.dataset.index = i;
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i, btn);
    container.appendChild(btn);
  });

  /* Reset tombol next */
  document.getElementById('btnNext').disabled = true;

  saveProgressToLocal();
}

/* ---------- PILIH JAWABAN ---------- */
function selectAnswer(index, btnEl) {
  if (optionsLocked || !gameActive) return;
  optionsLocked = true;

  const allOpts = document.querySelectorAll('.option-btn');
  allOpts.forEach(b => b.classList.add('disabled'));

  const isCorrect = (index === currentCorrectIndex);

  if (isCorrect) {
    btnEl.classList.add('correct');
    score = moneyLadder[currentIndex];
    updateScore();
    showToast(`✅ Benar! Hadiah: ${rupiah(score)}`);

    /* Aktifkan tombol Lanjut */
    document.getElementById('btnNext').disabled = false;

    /* Jika soal terakhir → menang */
    if (currentIndex === questions.length - 1) {
      setTimeout(() => endGame(true), 900);
    }
  } else {
    btnEl.classList.add('wrong');
    /* Tampilkan jawaban benar */
    allOpts[currentCorrectIndex].classList.add('correct');
    showToast(`❌ Salah. Jawaban benar: ${String.fromCharCode(65 + currentCorrectIndex)}`);
    setTimeout(() => endGame(false), 1200);
  }

  saveProgressToLocal();
}

/* ---------- NEXT SOAL ---------- */
function nextQuestion() {
  if (!gameActive) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    endGame(true);
  }
}

/* ---------- LIFELINE: 50:50 ---------- */
function useFiftyFifty() {
  if (lifelines.fifty || optionsLocked || !gameActive) {
    if (lifelines.fifty) showToast('⛔ 50:50 sudah dipakai.');
    return;
  }
  lifelines.fifty = true;
  document.getElementById('btnFifty').classList.add('used');

  /* Cari index salah, acak 2 untuk disembunyikan */
  const allOpts = document.querySelectorAll('.option-btn');
  let wrongIdx = [];
  allOpts.forEach((b, i) => { if (i !== currentCorrectIndex) wrongIdx.push(i); });
  wrongIdx = wrongIdx.sort(() => Math.random() - 0.5).slice(0, 2);
  wrongIdx.forEach(i => allOpts[i].classList.add('hidden-5050'));

  showToast('✂️ 50:50 — 2 jawaban salah dihilangkan.');
  saveProgressToLocal();
}

/* ---------- LIFELINE: PETUNJUK ---------- */
function useHint() {
  if (lifelines.hint || optionsLocked || !gameActive) {
    if (lifelines.hint) showToast('⛔ Petunjuk sudah dipakai.');
    return;
  }
  lifelines.hint = true;
  document.getElementById('btnHint').classList.add('used');
  const hint = questions[currentIndex].hint || 'Tidak ada petunjuk.';
  showToast(`💡 ${hint}`, 4000);
  saveProgressToLocal();
}

/* ---------- LIFELINE: LEWATI ---------- */
function useSkip() {
  if (lifelines.skip || optionsLocked || !gameActive) {
    if (lifelines.skip) showToast('⛔ Lewati sudah dipakai.');
    return;
  }
  lifelines.skip = true;
  document.getElementById('btnSkip').classList.add('used');
  showToast('⏭️ Soal dilewati. Tidak ada hadiah untuk soal ini.', 3000);

  setTimeout(() => {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      loadQuestion();
    } else {
      endGame(true);
    }
    saveProgressToLocal();
  }, 800);
}

/* ---------- END GAME ---------- */
function endGame(menang) {
  gameActive = false;
  optionsLocked = true;
  document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
  document.getElementById('btnNext').disabled = true;
  document.getElementById('btnFifty').classList.add('used');
  document.getElementById('btnHint').classList.add('used');
  document.getElementById('btnSkip').classList.add('used');

  const msg = document.getElementById('gameOverMsg');
  if (menang) {
    msg.textContent = `🏆 SELAMAT! Anda memenangkan ${rupiah(score || moneyLadder[14])}!`;
    if (score < moneyLadder[14]) score = moneyLadder[14];
    updateScore();
    showToast('🎉 LUAR BIASA! Anda Juara Kimia!', 5000);
  } else {
    msg.textContent = `💔 Game Over. Hadiah akhir: ${rupiah(score)}`;
    showToast('💔 Permainan Berakhir.', 4000);
  }
  saveProgressToLocal();
}

/* ---------- TOAST ---------- */
let toastTimer = null;
function showToast(text, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

/* ---------- LOCALSTORAGE ---------- */
const STORAGE_KEY = 'kimiaMillionaireProgress';

function saveProgressToLocal() {
  const state = {
    currentIndex,
    score,
    stage,
    lifelines,
    gameActive,
    timestamp: new Date().toISOString()
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* storage penuh / private mode */ }
}

function downloadProgress() {
  const state = {
    currentIndex,
    score,
    stage,
    lifelines,
    gameActive,
    timestamp: new Date().toISOString(),
    moneyEarned: moneyLadder.slice(0, currentIndex + 1),
    totalQuestions: questions.length
  };
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kimia-millionaire-progress-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📁 File JSON berhasil diunduh!');
}

/* ---------- INIT ---------- */
window.addEventListener('load', () => {
  initThree();
  currentIndex = 0;
  score = 0;
  stage = 1;
  gameActive = true;
  optionsLocked = false;
  lifelines = { fifty: false, hint: false, skip: false };

  /* Reset UI lifeline */
  document.getElementById('btnFifty').classList.remove('used');
  document.getElementById('btnHint').classList.remove('used');
  document.getElementById('btnSkip').classList.remove('used');
  document.getElementById('gameOverMsg').textContent = '';

  loadQuestion();
  updateScore();
});

/* Ekspos fungsi ke window (untuk atribut onclick) */
window.nextQuestion = nextQuestion;
window.useFiftyFifty = useFiftyFifty;
window.useHint = useHint;
window.useSkip = useSkip;
window.downloadProgress = downloadProgress;
</script>
</body>
